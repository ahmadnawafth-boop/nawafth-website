<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نوافذ | Nawafth - Relief & Development</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ===== CSS Variables ===== */
        :root {
            /* Primary Colors - from logo */
            --color-primary: #2D0A3E;
            --color-secondary: #4A0E5F;
            --color-accent-1: #8B1A3A;
            --color-accent-2: #C4284F;
            --color-accent-3: #E86A8A;
            
            /* Gradients */
            --gradient-main: linear-gradient(135deg, #2D0A3E 0%, #4A0E5F 40%, #8B1A3A 75%, #C4284F 100%);
            --gradient-card: linear-gradient(145deg, rgba(45,10,62,0.95), rgba(74,14,95,0.85));
            --gradient-glow: linear-gradient(135deg, rgba(139,26,58,0.3), rgba(196,40,79,0.1));
            
            /* Effects */
            --glass-bg: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.12);
            --shadow-primary: 0 8px 40px rgba(45,10,62,0.4);
            --shadow-hover: 0 16px 60px rgba(45,10,62,0.5);
            
            /* Typography */
            --font-ar: 'Tajawal', sans-serif;
            --font-en: 'Inter', sans-serif;
        }

        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-ar);
            background: var(--color-primary);
            color: #ffffff;
            line-height: 1.7;
            overflow-x: hidden;
        }

        body.lang-en {
            direction: ltr;
            font-family: var(--font-en);
        }

        body.lang-en .ar-only { display: none; }
        body:not(.lang-en) .en-only { display: none; }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-primary); }
        ::-webkit-scrollbar-thumb { background: var(--color-accent-2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-accent-3); }

        /* ===== Particles Background ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== Utility ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }

        .section-padding {
            padding: 6rem 0;
        }

        .section-badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 0.3rem 1.5rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--color-accent-3);
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .section-title .highlight {
            background: linear-gradient(135deg, var(--color-accent-3), var(--color-accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            font-size: 1.1rem;
            opacity: 0.7;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ===== Language Toggle ===== */
        .lang-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 0.4rem 0.6rem;
            display: flex;
            gap: 0.3rem;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }

        .lang-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s;
            font-family: inherit;
        }

        .lang-btn.active {
            background: var(--gradient-main);
            color: white;
            box-shadow: 0 4px 15px rgba(196,40,79,0.4);
        }

        .lang-btn:hover:not(.active) {
            color: white;
        }

        /* ===== Navbar ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0.8rem 0;
            transition: all 0.4s ease;
            background: transparent;
        }

        .navbar.scrolled {
            background: rgba(45,10,62,0.92);
            backdrop-filter: blur(25px);
            box-shadow: 0 4px 40px rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            height: 50px;
            width: auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            image-rendering: auto;
        }

        .nav-logo:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .nav-brand-text {
            font-size: 1.4rem;
            font-weight: 900;
            color: white;
        }

        .nav-brand-text .brand-accent {
            background: linear-gradient(135deg, var(--color-accent-3), var(--color-accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, var(--color-accent-3), var(--color-accent-2));
            transition: width 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: white;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--color-accent-2), var(--color-accent-1));
            padding: 0.5rem 1.5rem !important;
            border-radius: 50px;
            color: white !important;
            font-weight: 700 !important;
            box-shadow: 0 4px 20px rgba(196,40,79,0.3);
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(196,40,79,0.4);
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .mobile-toggle:hover {
            transform: scale(1.1);
        }

        /* ===== Hero ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: var(--gradient-main);
            padding: 6rem 0 4rem;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(196,40,79,0.2), transparent 70%);
            border-radius: 50%;
            animation: floatBubble 15s ease-in-out infinite;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139,26,58,0.15), transparent 70%);
            border-radius: 50%;
            animation: floatBubble 20s ease-in-out infinite reverse;
        }

        @keyframes floatBubble {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -40px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-content h1 {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .hero-content h1 .highlight {
            background: linear-gradient(135deg, #FF6B8A, #FF3D6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-content p {
            font-size: 1.15rem;
            opacity: 0.8;
            max-width: 500px;
            margin-bottom: 2.5rem;
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent-2), var(--color-accent-1));
            color: white;
            box-shadow: 0 4px 25px rgba(196,40,79,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(196,40,79,0.5);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
            transform: translateY(-3px);
        }

        .btn-icon {
            font-size: 1.2rem;
        }

        /* ===== Hero Logo - IMPROVED ===== */
        .hero-logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-logo-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glow ring around logo - more subtle */
        .hero-logo-container::before {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, 
                transparent 0%, 
                rgba(196,40,79,0.15) 25%, 
                transparent 50%, 
                rgba(139,26,58,0.15) 75%, 
                transparent 100%
            );
            animation: spinGlow 12s linear infinite;
        }

        @keyframes spinGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero-logo-container::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196,40,79,0.08), transparent 70%);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.05); opacity: 0.7; }
        }

        /* Logo image - high quality display */
        .hero-logo-img {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 420px;
            max-height: 420px;
            object-fit: contain;
            border-radius: 24px;
            filter: drop-shadow(0 20px 60px rgba(0,0,0,0.4)) brightness(1.05) contrast(1.05);
            animation: floatLogo 6s ease-in-out infinite;
            z-index: 1;
            image-rendering: auto;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            backdrop-filter: blur(2px);
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.01); }
        }

        /* Floating decorations */
        .floating-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            animation: floatDot 20s ease-in-out infinite;
        }

        .dot:nth-child(1) { width: 80px; height: 80px; top: 10%; right: 5%; animation-delay: 0s; }
        .dot:nth-child(2) { width: 120px; height: 120px; bottom: 15%; left: 8%; animation-delay: -5s; }
        .dot:nth-child(3) { width: 60px; height: 60px; top: 50%; right: 15%; animation-delay: -10s; }

        @keyframes floatDot {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(20px, -30px); }
            50% { transform: translate(-10px, -50px); }
            75% { transform: translate(30px, -20px); }
        }

        /* ===== About Section ===== */
        .about-section {
            background: var(--color-primary);
            position: relative;
        }

        .about-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(139,26,58,0.08), transparent 60%);
            pointer-events: none;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-image {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-primary);
            aspect-ratio: 4/3;
        }

        .about-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s;
        }

        .about-image:hover img {
            transform: scale(1.05);
        }

        .about-image .image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(45,10,62,0.3), rgba(139,26,58,0.15));
        }

        .about-image .experience-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            color: white;
            text-align: center;
        }

        .experience-badge .number {
            font-size: 2rem;
            font-weight: 900;
            display: block;
            background: linear-gradient(135deg, var(--color-accent-3), var(--color-accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .experience-badge .label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .about-text h2 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }

        .about-text p {
            opacity: 0.8;
            margin-bottom: 1.2rem;
            line-height: 1.8;
        }

        .about-stats-mini {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-mini {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-mini:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-4px);
        }

        .stat-mini .num {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--color-accent-3), var(--color-accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-mini .lbl {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* ===== Programs Section ===== */
        .programs-section {
            background: linear-gradient(180deg, var(--color-primary), rgba(45,10,62,0.9));
            position: relative;
        }

        .programs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 3rem;
        }

        .program-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .program-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, var(--color-accent-2), var(--color-accent-3));
            transform: scaleX(0);
            transition: transform 0.4s;
        }

        .program-card:hover::before {
            transform: scaleX(1);
        }

        .program-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,255,255,0.2);
            box-shadow: var(--shadow-hover);
        }

        .program-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(196,40,79,0.2), rgba(139,26,58,0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--color-accent-3);
        }

        .program-card h3 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
        }

        .program-card p {
            opacity: 0.7;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .program-card .learn-more {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            color: var(--color-accent-3);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .program-card .learn-more:hover {
            gap: 0.8rem;
        }

        /* ===== Gallery Section - NEW IMAGES ===== */
        .gallery-section {
            background: var(--color-primary);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4/3;
            cursor: pointer;
            transition: all 0.4s;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .gallery-item .gallery-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(45,10,62,0.85), transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-overlay h4 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .gallery-overlay p {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* ===== CTA Section ===== */
        .cta-section {
            background: linear-gradient(135deg, var(--color-accent-1), var(--color-accent-2));
            position: relative;
            overflow: hidden;
        }

        .cta-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
            border-radius: 50%;
        }

        .cta-content {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .cta-content h2 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }

        .cta-content p {
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 2rem;
            font-size: 1.1rem;
        }

        .cta-content .btn {
            background: white;
            color: var(--color-accent-1);
            box-shadow: 0 4px 30px rgba(0,0,0,0.2);
        }

        .cta-content .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }

        /* ===== Contact Section ===== */
        .contact-section {
            background: var(--color-primary);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-top: 3rem;
        }

        .contact-info h3 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .contact-info p {
            opacity: 0.7;
            margin-bottom: 2rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .contact-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }

        .contact-item .icon {
